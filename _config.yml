title: "Open-BioAFE Tutorial"
description: >-
  Designing a Biopotential Acquisition Chip from Scratch: an open design tutorial for undergraduate
  and early-graduate engineers building an 8-channel ExG front-end with SAR and delta-sigma ADCs in
  the IHP SG13G2 130 nm SiGe BiCMOS open PDK. By BRICD.

theme: just-the-docs

# Served by the bricd-org GitHub Pages site (custom domain www.thebricd.org).
# The Pages workflow passes the real base path, so these only matter for local builds.
url: https://www.thebricd.org
baseurl: /biomedical-ic-design

logo: "/assets/images/bricd-logo.png"
favicon_ico: "/favicon.ico"
color_scheme: bricd

aux_links:
  "Download the PDF":
    - "https://www.thebricd.org/biomedical-ic-design/assets/pdf/Open-BioAFE_Tutorial.pdf"
  "GitHub":
    - "https://github.com/bricd-org/biomedical-ic-design"
  "BRICD":
    - "https://www.thebricd.org"
aux_links_new_tab: false

nav_external_links:
  - title: Download the PDF
    url: https://www.thebricd.org/biomedical-ic-design/assets/pdf/Open-BioAFE_Tutorial.pdf
    hide_icon: false
  - title: Source on GitHub
    url: https://github.com/bricd-org/biomedical-ic-design

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Pages are generated from the LaTeX book by tools/build_site.py, so edit the LaTeX,
# not the HTML.
gh_edit_link: false
gh_edit_repository: "https://github.com/bricd-org/biomedical-ic-design"
gh_edit_branch: "main"
gh_edit_source: book
gh_edit_view_mode: "tree"

last_edit_timestamp: false
enable_copy_code_button: true

compress_html:
  ignore:
    envs: all

kramdown:
  input: GFM
  hard_wrap: false

# The pages generated by tools/build_site.py have no layout in their front matter, and plain
# Jekyll (unlike the classic GitHub Pages build) adds none, so give them the theme's layout here.
# Scoped to these paths so the theme's own JS and search index are not wrapped in HTML.
defaults:
  - scope:
      path: "chapters"
    values:
      layout: "default"
  - scope:
      path: "appendices"
    values:
      layout: "default"
  - scope:
      path: "parts"
    values:
      layout: "default"
  - scope:
      path: "preface.html"
    values:
      layout: "default"
  - scope:
      path: "references.html"
    values:
      layout: "default"

exclude:
  - book/
  - tools/
  - labs/
  - data/
  - README.md
  - LICENSE*
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - .venv/
