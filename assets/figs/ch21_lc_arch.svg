<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>A level-crossing ADC: two comparators around a tracking DAC level, and the events it produces from a waveform</title>
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1D2A30"/></marker>
    <marker id="lk" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A6212"/></marker>
  </defs>
  <text x="8" y="16" font-size="11.5" font-weight="700" fill="#1D2A30">(a) the converter: no sampling clock, only two comparators</text>
  <text x="8" y="90" font-size="12" font-style="italic" fill="#1D2A30">v(t)</text>
  <path d="M34 86 H70 M70 48 V122 M70 48 H112 M70 122 H112" stroke="#1D2A30" stroke-width="1.5" fill="none"/>
  <circle cx="70" cy="86" r="2.8" fill="#1D2A30"/>
  <path d="M112 40 L112 72 L152 56 Z" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.5"/>
  <path d="M112 98 L112 130 L152 114 Z" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.5"/>
  <path d="M200 192 H90 V64 H112 M90 106 H112" stroke="#1D2A30" stroke-width="1.5" fill="none"/>
  <circle cx="90" cy="106" r="2.6" fill="#1D2A30"/>
  <text x="96" y="186" font-size="8.5" fill="#56656B">v<tspan font-size="6.5" dy="2">DAC</tspan><tspan dy="-2"> ± δ</tspan></text>
  <path d="M152 56 H200" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#la)"/>
  <path d="M152 114 H200" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#la)"/>
  <text x="176" y="50" font-size="9" fill="#1A7A4C" text-anchor="middle">up</text>
  <text x="176" y="108" font-size="9" fill="#B5473A" text-anchor="middle">down</text>
  <text x="132" y="34" font-size="8.5" fill="#56656B" text-anchor="middle">v &gt; v<tspan font-size="6.5" dy="2">DAC</tspan><tspan dy="-2"> + δ</tspan></text>
  <text x="132" y="146" font-size="8.5" fill="#56656B" text-anchor="middle">v &lt; v<tspan font-size="6.5" dy="2">DAC</tspan><tspan dy="-2"> − δ</tspan></text>
  <rect x="200" y="38" width="108" height="94" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.5"/>
  <text x="254" y="70" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">asynchronous</text>
  <text x="254" y="84" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">logic</text>
  <text x="254" y="102" font-size="8.5" fill="#56656B" text-anchor="middle">up/down counter</text>
  <text x="254" y="115" font-size="8.5" fill="#56656B" text-anchor="middle">holds the level code</text>
  <rect x="200" y="172" width="108" height="40" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.5"/>
  <text x="254" y="189" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">DAC</text>
  <text x="254" y="203" font-size="8.5" fill="#56656B" text-anchor="middle">level ± δ</text>
  <path d="M254 132 V172" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#la)"/>
  <rect x="348" y="50" width="112" height="72" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.5"/>
  <text x="404" y="76" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">event register</text>
  <text x="404" y="94" font-size="8.5" fill="#56656B" text-anchor="middle">direction bit</text>
  <text x="404" y="107" font-size="8.5" fill="#56656B" text-anchor="middle">+ time stamp</text>
  <path d="M308 86 H348" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#la)"/>
  <path d="M404 16 V50" stroke="#9A6212" stroke-width="1.5" fill="none" marker-end="url(#lk)"/>
  <text x="410" y="28" font-size="8.5" fill="#9A6212">timer clock</text>
  <path d="M460 86 H500" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#la)"/>
  <text x="480" y="80" font-size="9" fill="#1D2A30" text-anchor="middle">events</text>
  <text x="514" y="56" font-size="9" fill="#56656B">Nothing samples the input on a clock:</text>
  <text x="514" y="69" font-size="9" fill="#56656B">a comparator fires when v(t) has moved</text>
  <text x="514" y="82" font-size="9" fill="#56656B">by δ from the last level, the counter</text>
  <text x="514" y="95" font-size="9" fill="#56656B">steps, and the DAC moves both thresholds.</text>
  <text x="514" y="108" font-size="9" fill="#56656B">Each event is one bit plus a time stamp,</text>
  <text x="514" y="121" font-size="9" fill="#56656B">so the data rate follows the signal's</text>
  <text x="514" y="134" font-size="9" fill="#56656B">activity. The timer's resolution and</text>
  <text x="514" y="147" font-size="9" fill="#56656B">the comparators' delay set the timing error.</text>
  <text x="8" y="236" font-size="11.5" font-weight="700" fill="#1D2A30">(b) the events from one heartbeat</text>
  <path d="M70 378.3 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 364.7 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 351.0 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 337.4 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 323.7 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 310.1 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 296.4 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 282.8 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 269.1 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <path d="M70 255.5 H700" stroke="#E1E8E8" stroke-width="0.8"/>
  <text x="64" y="323.7" font-size="8.5" fill="#56656B" text-anchor="end">levels</text>
  <text x="64" y="334.7" font-size="8.5" fill="#56656B" text-anchor="end">δ apart</text>
