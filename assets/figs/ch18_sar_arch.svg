<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>Architecture of the Open-BioAFE 12-bit asynchronous SAR converter</title>
  <defs>
    <marker id="sa" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1D2A30"/>
    </marker>
    <marker id="sk" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#9A6212"/>
    </marker>
  </defs>

  <!-- inputs and bootstrapped sampling switches -->
  <text x="14" y="96" font-size="12" fill="#1D2A30" font-style="italic">v<tspan font-size="9" dy="3">in+</tspan></text>
  <text x="14" y="196" font-size="12" fill="#1D2A30" font-style="italic">v<tspan font-size="9" dy="3">in−</tspan></text>
  <g stroke="#1D2A30" stroke-width="1.8" fill="none">
    <path d="M14 100 H62 M98 100 H400 V140 H430"/>
    <path d="M14 200 H62 M98 200 H400 V195 H430"/>
    <path d="M65 100 L92 89 M65 200 L92 189"/>
    <path d="M240 75 V100 M240 200 V225"/>
  </g>
  <g fill="#fff" stroke="#1D2A30" stroke-width="1.5">
    <circle cx="65" cy="100" r="2.6"/><circle cx="95" cy="100" r="2.6"/>
    <circle cx="65" cy="200" r="2.6"/><circle cx="95" cy="200" r="2.6"/>
  </g>
  <g fill="#1D2A30"><circle cx="240" cy="100" r="3"/><circle cx="240" cy="200" r="3"/></g>
  <text x="80" y="82" font-size="11" fill="#9A6212" text-anchor="middle" font-style="italic">φ<tspan font-size="8" dy="3">s</tspan></text>
  <text x="80" y="182" font-size="11" fill="#9A6212" text-anchor="middle" font-style="italic">φ<tspan font-size="8" dy="3">s</tspan></text>
  <text x="80" y="146" font-size="10" fill="#56656B" text-anchor="middle">bootstrapped</text>
  <text x="80" y="159" font-size="10" fill="#56656B" text-anchor="middle">switches (Ch 15)</text>
  <text x="300" y="94" font-size="11" fill="#1D2A30" font-style="italic">v<tspan font-size="8" dy="3">x+</tspan></text>
  <text x="300" y="194" font-size="11" fill="#1D2A30" font-style="italic">v<tspan font-size="8" dy="3">x−</tspan></text>

  <!-- capacitive DACs -->
  <g fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6">
    <rect x="150" y="30" width="180" height="45" rx="3"/>
    <rect x="150" y="225" width="180" height="45" rx="3"/>
  </g>
  <text x="240" y="48" font-size="12" font-weight="700" fill="#1D2A30" text-anchor="middle">CDAC+ (Ch 17)</text>
  <text x="240" y="64" font-size="10" fill="#56656B" text-anchor="middle">14 capacitors, radix 1.8, about 4 pF</text>
  <text x="240" y="243" font-size="12" font-weight="700" fill="#1D2A30" text-anchor="middle">CDAC− (Ch 17)</text>
  <text x="240" y="259" font-size="10" fill="#56656B" text-anchor="middle">mirror array, opposite switching</text>

  <!-- comparator -->
  <path d="M430 120 L430 215 L500 167 Z" fill="#fff" stroke="#1D2A30" stroke-width="1.8"/>
  <text x="436" y="145" font-size="12" fill="#1D2A30">+</text>
  <text x="436" y="200" font-size="12" fill="#1D2A30">−</text>
  <text x="465" y="234" font-size="10" fill="#56656B" text-anchor="middle">comparator (Ch 16)</text>

  <!-- SAR logic -->
  <rect x="540" y="110" width="150" height="115" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="615" y="150" font-size="12" font-weight="700" fill="#1D2A30" text-anchor="middle">asynchronous</text>
  <text x="615" y="166" font-size="12" font-weight="700" fill="#1D2A30" text-anchor="middle">SAR logic</text>
  <text x="615" y="186" font-size="10" fill="#56656B" text-anchor="middle">14 decisions per sample</text>
  <text x="615" y="200" font-size="10" fill="#56656B" text-anchor="middle">at 16 kS/s</text>
  <path d="M500 167 H538" stroke="#1D2A30" stroke-width="1.8" fill="none" marker-end="url(#sa)"/>

  <!-- decisions back to the bottom-plate switches -->
  <g stroke="#1D2A30" stroke-width="2.6" fill="none">
    <path d="M665 110 V52 H333" marker-end="url(#sa)"/>
    <path d="M575 225 V248 H333" marker-end="url(#sa)"/>
  </g>
  <text x="490" y="45" font-size="10.5" fill="#1D2A30" text-anchor="middle">each decision sets a bottom plate to V<tspan font-size="8" dy="2">ref+</tspan><tspan dy="-2">, V</tspan><tspan font-size="8" dy="2">cm</tspan><tspan dy="-2"> or V</tspan><tspan font-size="8" dy="2">ref−</tspan></text>

  <!-- self-timed comparator clock -->
  <path d="M575 110 V88 H465 V141" stroke="#9A6212" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#sk)"/>
  <text x="505" y="81" font-size="9.5" fill="#9A6212" text-anchor="middle">self-timed: each comparison starts when the last resolves</text>

  <!-- output -->
  <path d="M665 225 V256" stroke="#1D2A30" stroke-width="1.8" fill="none" marker-end="url(#sa)"/>
  <text x="712" y="272" font-size="10.5" fill="#1D2A30" text-anchor="end">14 raw bits →</text>
  <text x="712" y="287" font-size="10.5" fill="#1D2A30" text-anchor="end">12-bit code</text>
</svg>
