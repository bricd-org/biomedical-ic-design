<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>The stages of the Pan-Tompkins QRS detector</title>
  <defs>
    <marker id="pt" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1D2A30"/>
    </marker>
  </defs>
  <g stroke="#1D2A30" stroke-width="1.5" fill="#E4EEF8">
    <rect x="40" y="40" width="96" height="44" rx="3"/>
    <rect x="156" y="40" width="80" height="44" rx="3"/>
    <rect x="256" y="40" width="72" height="44" rx="3"/>
    <rect x="348" y="40" width="96" height="44" rx="3"/>
    <rect x="464" y="40" width="136" height="44" rx="3" fill="#FBF1DF"/>
  </g>
  <g stroke="#1D2A30" stroke-width="1.7" fill="none">
    <path d="M8 62 H38" marker-end="url(#pt)"/><path d="M136 62 H154" marker-end="url(#pt)"/>
    <path d="M236 62 H254" marker-end="url(#pt)"/><path d="M328 62 H346" marker-end="url(#pt)"/>
    <path d="M444 62 H462" marker-end="url(#pt)"/><path d="M600 62 H620" marker-end="url(#pt)"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#1D2A30" text-anchor="middle">
    <text x="88" y="59">band-pass</text><text x="196" y="59">derivative</text><text x="292" y="59">square</text>
    <text x="396" y="59">moving-window</text><text x="532" y="59">adaptive threshold</text>
  </g>
  <g font-size="9" fill="#56656B" text-anchor="middle">
    <text x="88" y="74">5–15 Hz</text><text x="196" y="74">5-point</text><text x="292" y="74">y = x²</text>
    <text x="396" y="74">integral, 150 ms</text><text x="532" y="74">200 ms refractory period</text>
  </g>
  <text x="8" y="54" font-size="9.5" fill="#56656B">ECG</text>
  <text x="624" y="58" font-size="10.5" fill="#1D2A30">R-peak times</text>
  <text x="624" y="72" font-size="9" fill="#56656B">→ RR intervals</text>

  <!-- waveform sketches -->
  <g stroke="#1F64A8" stroke-width="1.3" fill="none">
    <path d="M44 130 h10 l3 -3 l3 3 h6 l2 4 l3 -32 l3 38 l3 -10 h8 l4 -6 l6 6 h20"/>
    <path d="M160 130 h16 l3 -8 l3 18 l3 -24 l3 20 l3 -6 h34"/>
    <path d="M260 130 h22 l2 -6 l2 6 l2 -28 l2 28 l2 -14 l2 14 h28"/>
    <path d="M352 130 h20 q10 0 14 -26 q4 -8 8 0 q4 26 14 26 h30"/>
  </g>
  <path d="M352 112 H444" stroke="#B5473A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g stroke="#1D2A30" stroke-width="1.3"><path d="M480 130 H570 M500 130 V104 M548 130 V104"/></g>
  <g fill="#1D2A30"><circle cx="500" cy="104" r="2.5"/><circle cx="548" cy="104" r="2.5"/></g>
  <text x="524" y="146" font-size="9" fill="#56656B" text-anchor="middle">beats</text>
  <g font-size="9" fill="#56656B" text-anchor="middle">
    <text x="88" y="152">removes wander and</text><text x="88" y="163">muscle noise</text>
    <text x="196" y="152">emphasises the</text><text x="196" y="163">steep QRS slopes</text>
    <text x="292" y="152">all positive,</text><text x="292" y="163">large slopes win</text>
    <text x="396" y="152">one hump per QRS;</text><text x="396" y="163" fill="#B5473A">threshold (dashed)</text>
    <text x="524" y="163">signal and noise peak</text><text x="524" y="174">levels track the record</text>
  </g>
</svg>
