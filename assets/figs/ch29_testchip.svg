<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>The Open-BioAFE test chip concept: the chip, its test access and the test board</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1D2A30"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A6212"/></marker>
  </defs>
  <rect x="52" y="24" width="488" height="368" rx="6" fill="#F7F9F9" stroke="#1D2A30" stroke-width="1.8"/>
  <text x="64" y="44" font-size="10.5" font-weight="700" fill="#1F64A8">OPEN-BIOAFE TEST CHIP · IHP SG13G2 (concept)</text>
  <rect x="84" y="60" width="122" height="84" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="145.0" y="86.0" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">8 channels</text>
  <text x="145.0" y="99.0" font-size="8.5" fill="#56656B" text-anchor="middle">chopped LNA, servo,</text>
  <text x="145.0" y="112.0" font-size="8.5" fill="#56656B" text-anchor="middle">boost, PGA, Gm-C filter</text>
  <text x="145.0" y="125.0" font-size="8.5" fill="#56656B" text-anchor="middle">(Ch 7–12)</text>
  <rect x="250" y="60" width="86" height="84" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="293.0" y="92.5" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">8 × ΔΣ</text>
  <text x="293.0" y="105.5" font-size="8.5" fill="#56656B" text-anchor="middle">16 b, 500 S/s</text>
  <text x="293.0" y="118.5" font-size="8.5" fill="#56656B" text-anchor="middle">(Ch 20)</text>
  <rect x="368" y="60" width="140" height="84" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="438.0" y="78" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">digital back end</text>
  <text x="438.0" y="92" font-size="8.5" fill="#56656B" text-anchor="middle">decimators, features,</text>
  <text x="438.0" y="104" font-size="8.5" fill="#56656B" text-anchor="middle">coding, SPI (Ch 23–27)</text>
  <rect x="376" y="113" width="124" height="25" rx="2" fill="#fff" stroke="#9A6212" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="438.0" y="123.5" font-size="8.3" fill="#9A6212" text-anchor="middle">test modes: raw ΔΣ bit streams,</text>
  <text x="438.0" y="134" font-size="8.3" fill="#9A6212" text-anchor="middle">raw SAR codes, no decimation</text>
  <rect x="250" y="176" width="86" height="38" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="293.0" y="192.0" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">MUX + SAR</text>
  <text x="293.0" y="205.0" font-size="8.5" fill="#56656B" text-anchor="middle">12 b, 16 kS/s</text>
  <rect x="84" y="246" width="122" height="38" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="145.0" y="262.0" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">right-leg drive</text>
  <text x="145.0" y="275.0" font-size="8.5" fill="#56656B" text-anchor="middle">loop gain 100, 150 kΩ</text>
  <rect x="84" y="316" width="122" height="38" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="145.0" y="332.0" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">bioZ source + I/Q</text>
  <text x="145.0" y="345.0" font-size="8.5" fill="#56656B" text-anchor="middle">51.2 kHz, cal. resistor</text>
  <rect x="250" y="316" width="86" height="38" rx="3" fill="#F2F5F5" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="293.0" y="332.0" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">clock dividers</text>
  <text x="293.0" y="345.0" font-size="8.5" fill="#56656B" text-anchor="middle">1.024 MHz in</text>
  <rect x="368" y="316" width="140" height="38" rx="3" fill="#F2F5F5" stroke="#1D2A30" stroke-width="1.4"/>
  <text x="438.0" y="332.0" font-size="10" font-weight="700" fill="#1D2A30" text-anchor="middle">references, LDOs</text>
  <text x="438.0" y="345.0" font-size="8.5" fill="#56656B" text-anchor="middle">1 µF off chip at REF</text>
  <rect x="84" y="176" width="122" height="38" rx="3" fill="#fff" stroke="#9A6212" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="145.0" y="192.0" font-size="10" font-weight="700" fill="#9A6212" text-anchor="middle">test-signal generator</text>
  <text x="145.0" y="205.0" font-size="8.5" fill="#9A6212" text-anchor="middle">and lead-off currents</text>
  <rect x="368" y="246" width="140" height="38" rx="3" fill="#fff" stroke="#9A6212" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="438.0" y="262.0" font-size="10" font-weight="700" fill="#9A6212" text-anchor="middle">analog test MUX</text>
  <text x="438.0" y="275.0" font-size="8.5" fill="#9A6212" text-anchor="middle">any LNA, PGA or filter output</text>
  <rect x="12" y="66" width="40" height="60" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="32.0" y="87.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">IN1±</text>
  <text x="32.0" y="99.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">…</text>
  <text x="32.0" y="111.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">IN8±</text>
  <rect x="12" y="254" width="40" height="22" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="32.0" y="268.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">RLD</text>
  <rect x="12" y="324" width="40" height="22" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="32.0" y="338.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">BIOZ±</text>
  <rect x="540" y="66" width="40" height="60" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="560.0" y="87.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">SPI</text>
  <text x="560.0" y="99.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">+ DRDY</text>
  <text x="560.0" y="111.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">CLKIN</text>
  <rect x="540" y="248" width="40" height="16" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="560.0" y="259.0" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">TESTA</text>
  <rect x="540" y="267" width="40" height="16" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="560.0" y="278.0" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">TESTB</text>
  <rect x="540" y="324" width="40" height="22" rx="3" fill="#C98A1C" stroke="#9A6212" stroke-width="1"/>
  <text x="560.0" y="338.0" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">REF</text>
  <path d="M52 96 H84" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M206 96 H250" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M336 96 H368" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M508 96 H540" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M218 96 V195.0 H250" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <circle cx="218" cy="96" r="2.8" fill="#1D2A30"/>
  <path d="M336 195.0 H438 V144" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M84 265.0 H52" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M84 335.0 H52" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M508 335.0 H540" stroke="#1D2A30" stroke-width="1.5"/>
  <path d="M145 176 V144" stroke="#9A6212" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#aa)"/>
  <path d="M218 195.0 V265.0 H368" stroke="#9A6212" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#aa)"/>
  <text x="293.0" y="259.0" font-size="8.5" fill="#9A6212" text-anchor="middle">taps in every channel</text>
  <path d="M508 256 H540" stroke="#9A6212" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#aa)"/>
  <path d="M508 275 H540" stroke="#9A6212" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#aa)"/>
  <text x="64" y="378" font-size="8.5" fill="#56656B">blue: analog signal path · gold: digital · grey: support · dashed: test access, idle in normal use</text>
  <rect x="616" y="60" width="96" height="294" rx="8" fill="#1D2A30"/>
  <text x="664" y="84" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Test PCB</text>
  <text x="664" y="110" font-size="8.8" fill="#fff" text-anchor="middle">electrode simulator</text>
  <text x="664" y="122" font-size="8.8" fill="#B9C6C9" text-anchor="middle">51 kΩ ‖ 47 nF,</text>
  <text x="664" y="134" font-size="8.8" fill="#B9C6C9" text-anchor="middle">300 mV offset</text>
  <text x="664" y="160" font-size="8.8" fill="#fff" text-anchor="middle">precision DAC</text>
  <text x="664" y="172" font-size="8.8" fill="#B9C6C9" text-anchor="middle">plays MIT-BIH,</text>
  <text x="664" y="184" font-size="8.8" fill="#B9C6C9" text-anchor="middle">CHB-MIT records</text>
  <text x="664" y="210" font-size="8.8" fill="#fff" text-anchor="middle">CMRR fixture</text>
  <text x="664" y="222" font-size="8.8" fill="#B9C6C9" text-anchor="middle">common mode</text>
  <text x="664" y="234" font-size="8.8" fill="#B9C6C9" text-anchor="middle">through 200 pF</text>
  <text x="664" y="260" font-size="8.8" fill="#fff" text-anchor="middle">FPGA on SPI</text>
  <text x="664" y="272" font-size="8.8" fill="#B9C6C9" text-anchor="middle">raw streams, FFT</text>
  <text x="664" y="298" font-size="8.8" fill="#fff" text-anchor="middle">clean supplies</text>
  <text x="664" y="310" font-size="8.8" fill="#B9C6C9" text-anchor="middle">current per rail</text>
  <text x="664" y="336" font-size="8.8" fill="#B9C6C9" text-anchor="middle">(Chapter 22)</text>
  <path d="M616 90 H580" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M580 104 H616" stroke="#1D2A30" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M664 60 V14 H32 V66" stroke="#1D2A30" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
  <text x="350" y="10" font-size="8.5" fill="#56656B" text-anchor="middle">simulated electrodes and recorded biosignals from the test board into IN1± … IN8±</text>
</svg>
