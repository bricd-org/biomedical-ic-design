<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>How the mains couples to the body and reaches the amplifier</title>
  <defs>
    <marker id="ia" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#9A6212"/>
    </marker>
  </defs>

  <!-- mains -->
  <path d="M40 28 H300" stroke="#1D2A30" stroke-width="2.6"/>
  <text x="40" y="18" fill="#1D2A30" font-size="12" font-weight="700">mains wiring, 230 V / 50 Hz</text>

  <!-- wires -->
  <g stroke="#1D2A30" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M140 28 V64 M140 76 V112"/>
    <path d="M140 172 V226 M140 238 V292"/>
    <path d="M200 124 H262 M312 124 H470"/>
    <path d="M200 156 H262 M312 156 H470"/>
    <path d="M190 172 V250 H262 M312 250 H560"/>
    <path d="M400 124 V178 M400 202 V250"/>
    <path d="M440 156 V188 M440 212 V250"/>
    <path d="M560 250 V268 M560 280 V292"/>
    <path d="M590 140 H640"/>
  </g>
  <!-- capacitors -->
  <g stroke="#1D2A30" stroke-width="2.4">
    <path d="M126 64 H154 M126 76 H154"/>
    <path d="M126 226 H154 M126 238 H154"/>
    <path d="M546 268 H574 M546 280 H574"/>
  </g>
  <!-- impedance boxes -->
  <g fill="#fff" stroke="#1D2A30" stroke-width="1.8">
    <rect x="262" y="116" width="50" height="16" rx="2"/>
    <rect x="262" y="148" width="50" height="16" rx="2"/>
    <rect x="262" y="242" width="50" height="16" rx="2"/>
    <rect x="392" y="178" width="16" height="24" rx="2"/>
    <rect x="432" y="188" width="16" height="24" rx="2"/>
  </g>
  <!-- body -->
  <rect x="80" y="112" width="120" height="60" rx="26" fill="#FBF1DF" stroke="#9A6212" stroke-width="1.8"/>
  <text x="140" y="138" text-anchor="middle" fill="#1D2A30" font-size="13" font-weight="700">body</text>
  <text x="140" y="156" text-anchor="middle" fill="#1D2A30" font-size="13" font-style="italic">V<tspan dy="3" font-size="9.5">cm</tspan></text>
  <!-- amplifier -->
  <path d="M470 100 L470 180 L590 140 Z" fill="#fff" stroke="#1D2A30" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="480" y="128" fill="#1D2A30" font-size="14">+</text>
  <text x="481" y="161" fill="#1D2A30" font-size="16">−</text>
  <text x="646" y="144" fill="#1D2A30" font-size="13" font-style="italic">V<tspan dy="3" font-size="9.5">out</tspan></text>
  <!-- grounds -->
  <g stroke="#1D2A30" stroke-width="1.8">
    <path d="M124 292 H156 M130 298 H150 M136 304 H144"/>
    <path d="M544 292 H576 M550 298 H570 M556 304 H564"/>
  </g>
  <g fill="#1D2A30">
    <circle cx="400" cy="124" r="3"/><circle cx="440" cy="156" r="3"/>
    <circle cx="400" cy="250" r="3"/><circle cx="440" cy="250" r="3"/><circle cx="560" cy="250" r="3"/>
  </g>

  <!-- displacement current -->
  <path d="M172 40 V102" stroke="#9A6212" stroke-width="2" marker-end="url(#ia)"/>
  <text x="180" y="66" fill="#9A6212" font-size="12" font-style="italic">i<tspan dy="3" font-size="9">d</tspan><tspan dy="-3" font-style="normal"> ≈ 0.22 µA</tspan></text>

  <!-- labels -->
  <g fill="#1D2A30" font-size="12.5" font-style="italic">
    <text x="88" y="74">C<tspan dy="3" font-size="9.5">pow</tspan></text>
    <text x="84" y="236">C<tspan dy="3" font-size="9.5">body</tspan></text>
    <text x="278" y="110">Z<tspan dy="3" font-size="9.5">1</tspan></text>
    <text x="278" y="180">Z<tspan dy="3" font-size="9.5">2</tspan></text>
    <text x="278" y="274">Z<tspan dy="3" font-size="9.5">3</tspan></text>
    <text x="360" y="194">Z<tspan dy="3" font-size="9.5">cm</tspan></text>
    <text x="454" y="204">Z<tspan dy="3" font-size="9.5">cm</tspan></text>
    <text x="584" y="278">C<tspan dy="3" font-size="9.5">iso</tspan></text>
  </g>
  <g fill="#56656B" font-size="11">
    <text x="84" y="88">≈ 3 pF</text>
    <text x="84" y="252">≈ 200 pF</text>
    <text x="320" y="110">signal electrodes</text>
    <text x="320" y="274">ground or right-leg-drive electrode</text>
    <text x="452" y="243">amplifier ground</text>
    <text x="584" y="294">isolation</text>
    <text x="118" y="324">earth</text>
    <text x="538" y="324">earth</text>
  </g>
</svg>
