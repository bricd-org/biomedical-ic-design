<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 256" width="1000" height="256" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>The Open-BioAFE signal chain</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1D2A30"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E4C52"/>
    </marker>
  </defs>

  <!-- signal path -->
  <g stroke="#1D2A30" stroke-width="1.8" fill="none">
    <path d="M130 120 H150" marker-end="url(#arr)"/>
    <path d="M270 120 H290" marker-end="url(#arr)"/>
    <path d="M410 120 H430" marker-end="url(#arr)"/>
    <path d="M550 120 H556 M556 62 V178"/>
    <path d="M556 62 H563" marker-end="url(#arr)"/>
    <path d="M556 178 H563" marker-end="url(#arr)"/>
    <path d="M715 62 H726 V178 H715 M726 120 H736" marker-end="url(#arr)"/>
    <path d="M862 120 H878" marker-end="url(#arr)"/>
  </g>
  <!-- right-leg drive loop -->
  <g stroke="#3E4C52" stroke-width="1.6" fill="none" stroke-dasharray="5 3">
    <path d="M350 152 V202" marker-end="url(#arrs)"/>
    <path d="M180 222 H70 V154" marker-end="url(#arrs)"/>
  </g>

  <!-- blocks -->
  <g text-anchor="middle" fill="#1D2A30">
    <g fill="#fff" stroke="#1D2A30" stroke-width="1.6">
      <rect x="10" y="88" width="120" height="64" rx="4"/>
      <rect x="150" y="88" width="120" height="64" rx="4"/>
      <rect x="290" y="88" width="120" height="64" rx="4"/>
      <rect x="430" y="88" width="120" height="64" rx="4"/>
      <rect x="738" y="88" width="124" height="64" rx="4"/>
      <rect x="880" y="88" width="110" height="64" rx="4"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="70" y="111">Electrodes,</text><text x="70" y="126">body</text>
      <text x="210" y="111">ESD +</text><text x="210" y="126">lead-off</text>
      <text x="350" y="111">Chopper LNA</text><text x="350" y="126">+ DC servo</text>
      <text x="490" y="111">PGA +</text><text x="490" y="126">anti-alias</text>
      <text x="800" y="111">Decimation +</text><text x="800" y="126">feature DSP</text>
      <text x="935" y="111">Data out</text><text x="935" y="126">SPI / BLE</text>
    </g>
    <g font-size="11" fill="#56656B">
      <text x="70" y="143">Ch 2–4</text>
      <text x="210" y="143">Ch 12</text>
      <text x="350" y="143">Ch 5–10</text>
      <text x="490" y="143">Ch 11</text>
      <text x="800" y="143">Ch 20, 23–27</text>
      <text x="935" y="143">Ch 27</text>
    </g>
  </g>
  <!-- the two converters (Part III) -->
  <g text-anchor="middle">
    <rect x="565" y="37" width="150" height="50" rx="4" fill="#E6F4EC" stroke="#1A7A4C" stroke-width="2"/>
    <rect x="565" y="153" width="150" height="50" rx="4" fill="#E6F4EC" stroke="#1A7A4C" stroke-width="2"/>
    <text x="640" y="59" font-size="13" font-weight="700" fill="#1D2A30">12-bit SAR ADC</text>
    <text x="640" y="76" font-size="11" fill="#146240">Ch 15–18 · EMG, spikes</text>
    <text x="640" y="175" font-size="13" font-weight="700" fill="#1D2A30">Incremental ΔΣ ADC</text>
    <text x="640" y="192" font-size="11" fill="#146240">Ch 19–20 · ECG, EEG</text>
    <text x="640" y="24" font-size="11" font-weight="700" fill="#146240" letter-spacing="1">PART III · DATA CONVERTERS</text>
  </g>
  <!-- right-leg drive -->
  <g text-anchor="middle">
    <rect x="180" y="204" width="200" height="36" rx="4" fill="#F2F5F5" stroke="#3E4C52" stroke-width="1.6"/>
    <text x="280" y="220" font-size="12" font-weight="700" fill="#3E4C52">Right-leg drive · Ch 12</text>
    <text x="280" y="234" font-size="10.5" fill="#56656B">common-mode feedback to the body</text>
  </g>
</svg>
