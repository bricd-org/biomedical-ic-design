<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 274" width="1020" height="274" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>The Open-BioAFE signal chain</title>
  <defs>
    <!-- solid arrowheads drawn in user units, so they stay the same size on every line -->
    <marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1D2A30"/>
    </marker>
    <marker id="arr-fb" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#9A6212"/>
    </marker>
  </defs>

  <!-- signal path: electrodes -> ESD -> LNA -> PGA -->
  <g stroke="#1D2A30" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <path d="M110 140 H142" marker-end="url(#arr)"/>
    <path d="M246 140 H278" marker-end="url(#arr)"/>
    <path d="M382 140 H414" marker-end="url(#arr)"/>
    <!-- fork to the two converters -->
    <path d="M518 140 H540 M540 70 V210"/>
    <path d="M540 70 H568" marker-end="url(#arr)"/>
    <path d="M540 210 H568" marker-end="url(#arr)"/>
    <!-- merge into the decimation filter -->
    <path d="M718 70 H744 V210 H718"/>
    <path d="M744 140 H774" marker-end="url(#arr)"/>
    <path d="M878 140 H910" marker-end="url(#arr)"/>
  </g>
  <circle cx="540" cy="140" r="4.5" fill="#1D2A30"/>
  <circle cx="744" cy="140" r="4.5" fill="#1D2A30"/>

  <!-- right-leg drive loop: from the LNA back to the body -->
  <g stroke="#9A6212" stroke-width="2.2" fill="none" stroke-dasharray="7 4" stroke-linejoin="round">
    <path d="M330 172 V220" marker-end="url(#arr-fb)"/>
    <path d="M160 242 H58 V172" marker-end="url(#arr-fb)"/>
  </g>

  <!-- blocks -->
  <g text-anchor="middle" fill="#1D2A30">
    <g fill="#fff" stroke="#1D2A30" stroke-width="1.6">
      <rect x="6" y="108" width="104" height="64" rx="4"/>
      <rect x="142" y="108" width="104" height="64" rx="4"/>
      <rect x="278" y="108" width="104" height="64" rx="4"/>
      <rect x="414" y="108" width="104" height="64" rx="4"/>
      <rect x="774" y="108" width="104" height="64" rx="4"/>
      <rect x="910" y="108" width="104" height="64" rx="4"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="58" y="131">Electrodes,</text><text x="58" y="146">body</text>
      <text x="194" y="131">ESD +</text><text x="194" y="146">lead-off</text>
      <text x="330" y="131">Chopper LNA</text><text x="330" y="146">+ DC servo</text>
      <text x="466" y="131">PGA +</text><text x="466" y="146">anti-alias</text>
      <text x="826" y="131">Decimation +</text><text x="826" y="146">feature DSP</text>
      <text x="962" y="131">Data out</text><text x="962" y="146">SPI / BLE</text>
    </g>
    <g font-size="11" fill="#56656B">
      <text x="58" y="163">Ch 2–4</text>
      <text x="194" y="163">Ch 12</text>
      <text x="330" y="163">Ch 5–10</text>
      <text x="466" y="163">Ch 11</text>
      <text x="826" y="163">Ch 20, 23–27</text>
      <text x="962" y="163">Ch 27</text>
    </g>
  </g>

  <!-- the two converters (Part III) -->
  <g text-anchor="middle">
    <text x="643" y="30" font-size="11" font-weight="700" fill="#146240" letter-spacing="1">PART III · DATA CONVERTERS</text>
    <rect x="568" y="44" width="150" height="52" rx="4" fill="#E6F4EC" stroke="#1A7A4C" stroke-width="2"/>
    <rect x="568" y="184" width="150" height="52" rx="4" fill="#E6F4EC" stroke="#1A7A4C" stroke-width="2"/>
    <text x="643" y="67" font-size="13" font-weight="700" fill="#1D2A30">12-bit SAR ADC</text>
    <text x="643" y="84" font-size="11" fill="#146240">Ch 15–18 · EMG, spikes</text>
    <text x="643" y="207" font-size="13" font-weight="700" fill="#1D2A30">Incremental ΔΣ ADC</text>
    <text x="643" y="224" font-size="11" fill="#146240">Ch 19–20 · ECG, EEG</text>
  </g>

  <!-- right-leg drive -->
  <g text-anchor="middle">
    <rect x="160" y="222" width="240" height="40" rx="4" fill="#FBF1DF" stroke="#9A6212" stroke-width="1.8"/>
    <text x="280" y="239" font-size="12" font-weight="700" fill="#7A4E0E">Right-leg drive · Ch 12</text>
    <text x="280" y="254" font-size="10.5" fill="#56656B">common-mode feedback to the body</text>
  </g>
</svg>
