<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>One channel from the LNA to the two converter paths, with the gain and filter of each</title>
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1D2A30"/>
    </marker>
  </defs>
  <!-- blocks -->
  <g stroke="#1D2A30" stroke-width="1.6">
    <rect x="36" y="98" width="76" height="48" rx="3" fill="#E4EEF8"/>
    <rect x="144" y="98" width="82" height="48" rx="3" fill="#E4EEF8"/>
    <rect x="282" y="40" width="124" height="48" rx="3" fill="#E4EEF8"/>
    <rect x="282" y="160" width="124" height="48" rx="3" fill="#E4EEF8"/>
    <path d="M438 34 L438 94 L464 80 L464 48 Z" fill="#fff"/>
    <rect x="496" y="40" width="88" height="48" rx="3" fill="#fff"/>
    <rect x="496" y="160" width="88" height="48" rx="3" fill="#fff"/>
    <rect x="624" y="96" width="92" height="52" rx="3" fill="#FBF1DF"/>
  </g>
  <g stroke="#1D2A30" stroke-width="1.8" fill="none">
    <path d="M6 122 H36" marker-end="url(#ga)"/>
    <path d="M112 122 H144" marker-end="url(#ga)"/>
    <path d="M226 122 H250 V64 H282" marker-end="url(#ga)"/>
    <path d="M250 122 V184 H282" marker-end="url(#ga)"/>
    <path d="M406 64 H438" marker-end="url(#ga)"/>
    <path d="M464 64 H496" marker-end="url(#ga)"/>
    <path d="M406 184 H496" marker-end="url(#ga)"/>
    <path d="M584 64 H670 V96" marker-end="url(#ga)"/>
    <path d="M584 184 H670 V148" marker-end="url(#ga)"/>
    <path d="M451 6 V41" marker-end="url(#ga)"/>
  </g>
  <circle cx="250" cy="122" r="3" fill="#1D2A30"/>
  <g font-size="11.5" font-weight="700" fill="#1D2A30" text-anchor="middle">
    <text x="74" y="119">LNA</text><text x="185" y="119">PGA</text>
    <text x="344" y="61">anti-alias filter</text><text x="344" y="181">one-pole filter</text>
    <text x="540" y="61">12-bit SAR</text><text x="540" y="181" font-size="11">incremental ΔΣ</text>
    <text x="670" y="119">digital</text>
  </g>
  <g font-size="9.5" fill="#56656B" text-anchor="middle">
    <text x="74" y="134">×100 or ×10</text><text x="185" y="134">×1, 2, 4, 8, 16</text>
    <text x="344" y="76">4th-order Gm-C, 600 Hz</text><text x="344" y="196">a few kHz</text>
    <text x="540" y="76">16 kS/s, shared</text><text x="540" y="196">512 kHz, 500 S/s</text>
    <text x="670" y="132">decimation,</text><text x="670" y="143">features (Part IV)</text>
    <text x="458" y="16" text-anchor="start">7 other channels</text>
    <text x="451" y="106">8:1 MUX</text>
  </g>
  <g font-size="10" fill="#1D2A30">
    <text x="282" y="30" font-weight="700">SAR path: EMG (and spikes)</text>
    <text x="282" y="228" font-weight="700">ΔΣ path: ECG and EEG, one per channel</text>
  </g>
  <text x="4" y="90" font-size="9.5" fill="#56656B">electrodes</text>

  <!-- gain plan -->
  <g font-size="9.5" fill="#1D2A30">
    <text x="30" y="186" font-weight="700">total gain onto ±0.5 V</text>
    <text x="30" y="201">ECG 100 × 1 = 100</text>
    <text x="30" y="215">EEG 100 × 8 = 800</text>
    <text x="30" y="229">EMG 10 × 8 = 80</text>
    <text x="140" y="201" fill="#56656B">(±4 mV → ±0.40 V)</text>
    <text x="140" y="215" fill="#56656B">(±300 µV → ±0.24 V)</text>
    <text x="140" y="229" fill="#56656B">(±5 mV → ±0.40 V)</text>
  </g>
</svg>
