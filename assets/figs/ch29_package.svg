  <text x="480" y="96" font-size="10.5" font-weight="700" fill="#1D2A30">QFN-40, 6 × 6 mm, 0.5 mm pitch</text>
  <rect x="480" y="106" width="10" height="10" fill="#1F64A8"/>
  <text x="496" y="115" font-size="8.8" fill="#1D2A30">electrode inputs, shields, RLD (19)</text>
  <rect x="480" y="122" width="10" height="10" fill="#7FA7CF"/>
  <text x="496" y="131" font-size="8.8" fill="#1D2A30">bioZ, reference, analog test (5)</text>
  <rect x="480" y="138" width="10" height="10" fill="#8C9A9F"/>
  <text x="496" y="147" font-size="8.8" fill="#1D2A30">supplies and grounds (9)</text>
  <rect x="480" y="154" width="10" height="10" fill="#C98A1C"/>
  <text x="496" y="163" font-size="8.8" fill="#1D2A30">SPI, clock, reset, DRDY (7)</text>
  <text x="480" y="192" font-size="8.8" fill="#1D2A30" font-weight="700">Inputs wrap round the top-left corner,</text>
  <text x="480" y="204" font-size="8.8" fill="#56656B">one SHLD pin at each end of the group:</text>
  <text x="480" y="216" font-size="8.8" fill="#56656B">the driven shield of Chapter 12 guards</text>
  <text x="480" y="228" font-size="8.8" fill="#56656B">the traces on the board as well.</text>
  <text x="480" y="252" font-size="8.8" fill="#1D2A30" font-weight="700">SPI, clock and reset sit in the opposite</text>
  <text x="480" y="264" font-size="8.8" fill="#56656B">corner, with their own VDDIO and VSSIO.</text>
  <text x="480" y="288" font-size="8.8" fill="#1D2A30" font-weight="700">Analog supplies separate the groups;</text>
  <text x="480" y="300" font-size="8.8" fill="#56656B">the exposed pad is VSSA, and REF takes</text>
  <text x="480" y="312" font-size="8.8" fill="#56656B">1 µF to VSSA right at the pin.</text>
  <text x="480" y="336" font-size="8.8" fill="#1D2A30" font-weight="700">Concept only: the pin count follows the</text>
  <text x="480" y="348" font-size="8.8" fill="#56656B">test chip above; a product would drop</text>
  <text x="480" y="360" font-size="8.8" fill="#56656B">the TEST pins.</text>
</svg>
