<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>Tetrapolar bioimpedance measurement and its IQ readout</title>
  <defs>
    <marker id="ba" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1D2A30"/>
    </marker>
    <marker id="bk" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#9A6212"/>
    </marker>
  </defs>
  <!-- tissue -->
  <rect x="96" y="30" width="300" height="44" rx="14" fill="#F2F5F5" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="246" y="49" font-size="11.5" font-weight="700" fill="#1D2A30" text-anchor="middle">tissue, Z(f)</text>
  <text x="246" y="64" font-size="9.5" fill="#56656B" text-anchor="middle">Cole model: 42 Ω, −12° at 50 kHz</text>

  <!-- electrodes -->
  <g stroke="#1D2A30" stroke-width="1.7" fill="none">
    <path d="M130 74 V92 M130 116 V236 H232 M268 236 H362 V116 M362 92 V74"/>
    <path d="M200 74 V92 M200 116 V140 H226 V152"/>
    <path d="M292 74 V92 M292 116 V140 H266 V152"/>
    <path d="M286 172 H420"/>
    <path d="M420 172 V122 H446" marker-end="url(#ba)"/>
    <path d="M420 172 V222 H446" marker-end="url(#ba)"/>
    <path d="M472 122 H492" marker-end="url(#ba)"/>
    <path d="M472 222 H492" marker-end="url(#ba)"/>
    <path d="M546 122 H566 V160 H584" marker-end="url(#ba)"/>
    <path d="M546 222 H566 V184 H584" marker-end="url(#ba)"/>
    <path d="M644 172 H662" marker-end="url(#ba)"/>
  </g>
  <g fill="#fff" stroke="#1D2A30" stroke-width="1.5">
    <rect x="122" y="92" width="16" height="24" rx="2"/>
    <rect x="192" y="92" width="16" height="24" rx="2"/>
    <rect x="284" y="92" width="16" height="24" rx="2"/>
    <rect x="354" y="92" width="16" height="24" rx="2"/>
  </g>
  <g font-size="10" fill="#1D2A30" font-weight="700" text-anchor="middle">
    <text x="112" y="88">I+</text><text x="184" y="88">V+</text><text x="310" y="88">V−</text><text x="380" y="88">I−</text>
  </g>
  <g font-size="9" fill="#56656B" font-style="italic">
    <text x="142" y="108">Z<tspan font-size="6.5" dy="2">e</tspan></text><text x="212" y="108">Z<tspan font-size="6.5" dy="2">e</tspan></text>
    <text x="304" y="108">Z<tspan font-size="6.5" dy="2">e</tspan></text><text x="374" y="108">Z<tspan font-size="6.5" dy="2">e</tspan></text>
  </g>
  <!-- current source -->
  <circle cx="250" cy="236" r="18" fill="#fff" stroke="#9A6212" stroke-width="1.8"/>
  <path d="M240 236 H256" stroke="#9A6212" stroke-width="1.8" fill="none" marker-end="url(#bk)"/>
  <text x="250" y="270" font-size="10" fill="#9A6212" text-anchor="middle">I<tspan font-size="7" dy="2">exc</tspan><tspan dy="-2">: 50 kHz, 10–50 µA rms, DC-blocked</tspan></text>

  <!-- IA -->
  <rect x="214" y="152" width="72" height="40" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="250" y="170" font-size="10.5" font-weight="700" fill="#1D2A30" text-anchor="middle">IA</text>
  <text x="250" y="184" font-size="8.5" fill="#56656B" text-anchor="middle">at 50 kHz</text>
  <text x="250" y="208" font-size="9" fill="#56656B" text-anchor="middle">I<tspan font-size="6.5" dy="2">exc</tspan><tspan dy="-2">·Z, no electrode drop</tspan></text>

  <!-- IQ demodulator -->
  <g fill="#fff" stroke="#1D2A30" stroke-width="1.5">
    <circle cx="459" cy="122" r="12"/><circle cx="459" cy="222" r="12"/>
  </g>
  <g stroke="#1D2A30" stroke-width="1.3"><path d="M453 116 L465 128 M465 116 L453 128 M453 216 L465 228 M465 216 L453 228"/></g>
  <g stroke="#9A6212" stroke-width="1.5" fill="none">
    <path d="M459 86 V108" marker-end="url(#bk)"/><path d="M459 258 V236" marker-end="url(#bk)"/>
  </g>
  <text x="459" y="80" font-size="9.5" fill="#9A6212" text-anchor="middle">cos ω t</text>
  <text x="459" y="270" font-size="9.5" fill="#9A6212" text-anchor="middle">sin ω t</text>
  <g stroke="#1D2A30" stroke-width="1.5" fill="#E4EEF8">
    <rect x="494" y="106" width="52" height="32" rx="3"/><rect x="494" y="206" width="52" height="32" rx="3"/>
    <rect x="586" y="150" width="58" height="44" rx="3" fill="#fff"/>
  </g>
  <rect x="664" y="150" width="52" height="44" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.5"/>
  <g font-size="10" fill="#1D2A30" text-anchor="middle">
    <text x="520" y="126">low-pass</text><text x="520" y="226">low-pass</text>
    <text x="615" y="169" font-weight="700">SAR</text><text x="615" y="182" font-size="8.5" fill="#56656B">shared</text>
    <text x="690" y="169" font-style="italic">|Z|, φ</text><text x="690" y="182" font-size="8.5" fill="#56656B">digital</text>
  </g>
  <g font-size="10" fill="#1D2A30" font-style="italic"><text x="552" y="114">I</text><text x="552" y="216">Q</text></g>
  <text x="560" y="62" font-size="9.5" fill="#56656B" text-anchor="middle">references: square waves from</text>
  <text x="560" y="74" font-size="9.5" fill="#56656B" text-anchor="middle">the chopper's clock source</text>
  <text x="14" y="160" font-size="9.5" fill="#56656B">outer pair carries</text>
  <text x="14" y="173" font-size="9.5" fill="#56656B">the current; inner</text>
  <text x="14" y="186" font-size="9.5" fill="#56656B">pair senses, with</text>
  <text x="14" y="199" font-size="9.5" fill="#56656B">no current in Z<tspan font-size="7" dy="2">e</tspan></text>
</svg>
