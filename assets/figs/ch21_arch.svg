<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>A direct-digitisation front-end and a VCO-based ADC</title>
  <defs>
    <marker id="va" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1D2A30"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="12" font-weight="700" fill="#1D2A30">(a) direct digitisation: no separate LNA</text>
  <text x="378" y="20" font-size="12" font-weight="700" fill="#1D2A30">(b) VCO-based ADC</text>
  <path d="M364 30 V225" stroke="#E1E8E8" stroke-width="1.5"/>

  <!-- (a) -->
  <text x="10" y="94" font-size="12" fill="#1D2A30" font-style="italic">v<tspan font-size="8" dy="3">e</tspan></text>
  <text x="10" y="122" font-size="9.5" fill="#56656B">electrode</text>
  <g stroke="#1D2A30" stroke-width="1.8" fill="none">
    <path d="M24 100 H40 M50 100 H64"/>
    <path d="M64 100 H94" marker-end="url(#va)"/>
    <path d="M160 100 H192" marker-end="url(#va)"/>
    <path d="M236 100 H268" marker-end="url(#va)"/>
    <path d="M300 100 H352" marker-end="url(#va)"/>
    <path d="M324 100 V170 H252 M208 170 H64 V100"/>
  </g>
  <path d="M40 86 V114 M50 86 V114" stroke="#1D2A30" stroke-width="2.6"/>
  <text x="45" y="78" font-size="10" fill="#1D2A30" text-anchor="middle" font-style="italic">C<tspan font-size="7" dy="2">in</tspan></text>
  <circle cx="64" cy="100" r="3" fill="#1D2A30"/>
  <circle cx="324" cy="100" r="3" fill="#1D2A30"/>
  <rect x="94" y="80" width="66" height="40" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="127" y="98" font-size="10.5" fill="#1D2A30" text-anchor="middle">integrator 1</text>
  <text x="127" y="112" font-size="9.5" fill="#9A6212" text-anchor="middle">chopped</text>
  <rect x="192" y="80" width="44" height="40" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="214" y="104" font-size="10.5" fill="#1D2A30" text-anchor="middle">int. 2</text>
  <rect x="268" y="80" width="32" height="40" rx="3" fill="#fff" stroke="#1D2A30" stroke-width="1.6"/>
  <path d="M274 110 H284 V90 H294" stroke="#1D2A30" stroke-width="1.6" fill="none"/>
  <text x="338" y="92" font-size="12" fill="#1D2A30" font-style="italic">v</text>
  <rect x="208" y="156" width="44" height="28" rx="3" fill="#fff" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="230" y="174" font-size="10" fill="#1D2A30" text-anchor="middle">DAC</text>
  <g font-size="9.5" fill="#56656B">
    <text x="58" y="64">summing node at the input</text>
    <text x="10" y="204">the loop gain amplifies; integrator 1 is the low-noise</text>
    <text x="10" y="217">stage; feedback at the input gives a range of tens to</text>
    <text x="10" y="230">hundreds of millivolts, for offsets and artefacts</text>
  </g>

  <!-- (b) -->
  <text x="372" y="94" font-size="12" fill="#1D2A30" font-style="italic">v<tspan font-size="8" dy="3">in</tspan></text>
  <g stroke="#1D2A30" stroke-width="1.8" fill="none">
    <path d="M388 100 H418" marker-end="url(#va)"/>
    <path d="M478 100 H508" marker-end="url(#va)"/>
    <path d="M592 100 H622" marker-end="url(#va)"/>
    <path d="M668 100 H700" marker-end="url(#va)"/>
  </g>
  <rect x="418" y="76" width="60" height="48" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="448" y="97" font-size="11.5" font-weight="700" fill="#1D2A30" text-anchor="middle">VCO</text>
  <text x="448" y="113" font-size="8.5" fill="#56656B" text-anchor="middle">f = f<tspan font-size="6.5" dy="2">0</tspan><tspan dy="-2"> + K v</tspan><tspan font-size="6.5" dy="2">in</tspan></text>
  <rect x="508" y="76" width="84" height="48" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="550" y="97" font-size="10.5" fill="#1D2A30" text-anchor="middle">edge counter,</text>
  <text x="550" y="112" font-size="9" fill="#56656B" text-anchor="middle">read every 1/f<tspan font-size="6.5" dy="2">s</tspan></text>
  <rect x="622" y="76" width="46" height="48" rx="3" fill="#FBF1DF" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="645" y="104" font-size="11" fill="#1D2A30" text-anchor="middle" font-style="italic">1 − z<tspan font-size="7" dy="-5">−1</tspan></text>
  <text x="702" y="90" font-size="12" fill="#1D2A30" font-style="italic">D</text>
  <!-- ring-oscillator waveform -->
  <path d="M420 160 h8 v-14 h8 v14 h8 v-14 h8 v14 h6 v-14 h6 v14 h5 v-14 h5 v14 h5 v-14 h5 v14 h8" stroke="#9A6212" stroke-width="1.4" fill="none"/>
  <text x="420" y="178" font-size="9" fill="#9A6212">frequency follows v<tspan font-size="6.5" dy="2">in</tspan></text>
  <g font-size="9.5" fill="#56656B">
    <text x="378" y="204">the phase integrates the frequency, so the count's rounding</text>
    <text x="378" y="217">error carries over: first-order noise shaping, built</text>
    <text x="378" y="230">almost entirely from digital gates</text>
  </g>
</svg>
