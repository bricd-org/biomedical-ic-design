<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>System partition of a biosignal chip: sensing, on-chip processing, the data link, power management and stimulation</title>
  <defs>
    <marker id="sy" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1D2A30"/>
    </marker>
    <marker id="sg" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1A7A4C"/>
    </marker>
  </defs>
  <!-- chip outline -->
  <rect x="92" y="28" width="416" height="192" rx="8" fill="none" stroke="#B9C6C9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="102" y="22" font-size="10" fill="#56656B">the chip</text>

  <g stroke="#1D2A30" stroke-width="1.5">
    <rect x="8" y="56" width="64" height="50" rx="3" fill="#F2F5F5"/>
    <rect x="104" y="56" width="112" height="50" rx="3" fill="#E4EEF8"/>
    <rect x="248" y="42" width="144" height="76" rx="3" fill="#FBF1DF"/>
    <rect x="520" y="56" width="90" height="50" rx="3" fill="#fff"/>
    <rect x="642" y="56" width="70" height="50" rx="3" fill="#F2F5F5"/>
    <rect x="104" y="150" width="120" height="56" rx="3" fill="#fff"/>
    <rect x="248" y="150" width="144" height="56" rx="3" fill="#E4EEF8"/>
    <rect x="520" y="150" width="120" height="56" rx="3" fill="#F2F5F5"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#1D2A30" text-anchor="middle">
    <text x="40" y="85">electrodes</text>
    <text x="160" y="74">AFE and ADCs</text>
    <text x="320" y="60">on-chip processing</text>
    <text x="565" y="74">radio link</text>
    <text x="677" y="78" font-size="10">phone or</text><text x="677" y="92" font-size="10">base station</text>
    <text x="164" y="171">stimulator</text>
    <text x="320" y="171">power management</text>
    <text x="580" y="171">battery or</text><text x="580" y="185">harvester</text>
  </g>
  <g font-size="9" fill="#56656B" text-anchor="middle">
    <text x="160" y="88">Parts II–III</text><text x="160" y="100">80 µW for 8 channels</text>
    <text x="320" y="75">decimation, features,</text><text x="320" y="87">small classifiers,</text>
    <text x="320" y="99">lossless coding</text><text x="320" y="112">picojoules per operation</text>
    <text x="565" y="88" font-size="8.5">BLE ≈ 5 nJ/bit;</text><text x="565" y="100" font-size="8.5">backscatter, inductive</text>
    <text x="164" y="186">optional: biphasic</text><text x="164" y="198">current DAC, charge balance</text>
    <text x="320" y="186">three LDOs: analog,</text><text x="320" y="198">converter, digital; PSRR ≥ 80 dB</text>
    <text x="580" y="199">100 mAh, or tens of µW</text>
  </g>
  <g stroke="#1D2A30" stroke-width="1.6" fill="none">
    <path d="M72 81 H104" marker-end="url(#sy)"/>
    <path d="M216 81 H248" marker-end="url(#sy)"/>
    <path d="M392 74 H520" marker-end="url(#sy)"/>
    <path d="M610 81 H642" marker-end="url(#sy)"/>
    <path d="M104 178 H40 V106" marker-end="url(#sy)"/>
  </g>
  <path d="M392 98 H520" stroke="#1D2A30" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#sy)"/>
  <text x="456" y="68" font-size="9.5" fill="#1D2A30" text-anchor="middle">features 0.3–12.5 kb/s</text>
  <text x="456" y="113" font-size="9.5" fill="#56656B" text-anchor="middle">raw on demand,</text><text x="456" y="125" font-size="9.5" fill="#56656B" text-anchor="middle">33–360 kb/s</text>
  <!-- supplies -->
  <g stroke="#1A7A4C" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <path d="M520 178 H392" marker-end="url(#sg)"/>
    <path d="M300 150 V118" marker-end="url(#sg)"/>
    <path d="M256 150 V138 H180 V106" marker-end="url(#sg)"/>
  </g>
  <text x="14" y="246" font-size="9.5" fill="#56656B">At 5 nJ/bit, raw EMG from eight channels costs 960 µW in the radio, twelve times the front-end; features cost 2–13 µW.</text>
</svg>
