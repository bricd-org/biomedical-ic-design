<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 344" width="768" height="344" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>Three reading paths through the Open-BioAFE tutorial</title>
  <!-- links (drawn first, under the boxes) -->
  <g stroke-width="2.6" fill="none">
    <path d="M80 176 L288 72 L480 72 L688 124" stroke="#8A6A1C"/>
    <path d="M80 176 L288 176 L480 176 L688 124" stroke="#2B5797"/>
    <path d="M288 280 L480 280" stroke="#34446A"/>
  </g>
  <!-- boxes: centre (x, y), 112 x 50 -->
  <g stroke-width="1.8" fill="#fff" text-anchor="middle" font-weight="700">
    <g stroke="#1B2A52" fill="#1B2A52">
      <rect x="24" y="151" width="112" height="50" rx="4" fill="#fff"/>
      <text x="80" y="172" font-size="15" stroke="none">Part I</text>
      <text x="80" y="190" font-size="12" stroke="none" font-weight="500">Ch 1–4</text>
      <rect x="632" y="99" width="112" height="50" rx="4" fill="#fff"/>
      <text x="688" y="120" font-size="15" stroke="none">Part V</text>
      <text x="688" y="138" font-size="12" stroke="none" font-weight="500">Ch 29–31</text>
    </g>
    <g stroke="#8A6A1C" fill="#8A6A1C">
      <rect x="232" y="47" width="112" height="50" rx="4" fill="#fff"/>
      <text x="288" y="68" font-size="15" stroke="none">Part II</text>
      <text x="288" y="86" font-size="12" stroke="none" font-weight="500">Ch 5–12</text>
      <rect x="424" y="47" width="112" height="50" rx="4" fill="#fff"/>
      <text x="480" y="68" font-size="15" stroke="none">Part III</text>
      <text x="480" y="86" font-size="12" stroke="none" font-weight="500">Ch 13–22</text>
    </g>
    <g stroke="#2B5797" fill="#2B5797">
      <rect x="232" y="151" width="112" height="50" rx="4" fill="#fff"/>
      <text x="288" y="172" font-size="15" stroke="none">Part IV</text>
      <text x="288" y="190" font-size="12" stroke="none" font-weight="500">Ch 23–28</text>
      <rect x="424" y="151" width="112" height="50" rx="4" fill="#fff"/>
      <text x="480" y="172" font-size="15" stroke="none">Ch 13–14</text>
      <text x="480" y="190" font-size="12" stroke="none" font-weight="500">ADC specs</text>
    </g>
    <g stroke="#34446A" fill="#34446A">
      <rect x="232" y="255" width="112" height="50" rx="4" fill="#fff"/>
      <text x="288" y="285" font-size="15" stroke="none">Ch 13–22</text>
      <rect x="424" y="255" width="112" height="50" rx="4" fill="#fff"/>
      <text x="480" y="285" font-size="15" stroke="none">Labs 6–10</text>
    </g>
  </g>
  <!-- path labels -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="384" y="34" fill="#8A6A1C">circuit path: to a tape-out</text>
    <text x="384" y="143" fill="#2B5797">signal path: specify the hardware</text>
    <text x="384" y="330" fill="#34446A">converter-only path: a data-converter course</text>
  </g>
</svg>
