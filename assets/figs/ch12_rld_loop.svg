<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>The right-leg drive loop: body, electrodes, amplifier, integrator and safety resistor</title>
  <defs>
    <marker id="ra" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1D2A30"/>
    </marker>
    <marker id="rk" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1A7A4C"/>
    </marker>
  </defs>
  <!-- mains and earth -->
  <path d="M20 24 H130" stroke="#1D2A30" stroke-width="2.4"/>
  <text x="136" y="28" font-size="10.5" fill="#1D2A30">mains, 230 V, 50 Hz</text>
  <g stroke="#1D2A30" stroke-width="1.8" fill="none"><path d="M55 24 V44 M55 52 V80 M55 250 V262 M55 270 V282"/></g>
  <g stroke="#1D2A30" stroke-width="2.6"><path d="M43 44 H67 M43 52 H67 M43 262 H67 M43 270 H67"/></g>
  <g stroke="#1D2A30" stroke-width="1.6"><path d="M45 282 H65 M49 287 H61 M53 292 H57"/></g>
  <text x="72" y="52" font-size="9.5" fill="#56656B">C<tspan font-size="7" dy="2">pow</tspan><tspan dy="-2"> ≈ 3 pF</tspan></text>
  <text x="72" y="270" font-size="9.5" fill="#56656B">C<tspan font-size="7" dy="2">body</tspan><tspan dy="-2"> ≈ 200 pF</tspan></text>

  <!-- body -->
  <rect x="20" y="80" width="70" height="170" rx="22" fill="#F2F5F5" stroke="#1D2A30" stroke-width="1.8"/>
  <text x="55" y="170" font-size="12" font-weight="700" fill="#1D2A30" text-anchor="middle">body</text>

  <!-- electrodes -->
  <g stroke="#1D2A30" stroke-width="1.8" fill="none">
    <path d="M90 105 H104 M144 105 H250"/>
    <path d="M90 145 H104 M144 145 H250"/>
    <path d="M90 230 H104 M144 230 H160 M204 230 H226"/>
    <path d="M330 125 H400" marker-end="url(#ra)"/>
    <path d="M290 165 V204" marker-end="url(#ra)"/>
  </g>
  <g fill="#fff" stroke="#1D2A30" stroke-width="1.6">
    <rect x="104" y="97" width="40" height="16" rx="2"/>
    <rect x="104" y="137" width="40" height="16" rx="2"/>
    <rect x="104" y="222" width="40" height="16" rx="2"/>
  </g>
  <rect x="160" y="222" width="44" height="16" rx="2" fill="#fff" stroke="#B5473A" stroke-width="1.8"/>
  <g font-size="10" fill="#1D2A30" font-style="italic" text-anchor="middle">
    <text x="124" y="92">Z<tspan font-size="7" dy="2">e1</tspan></text><text x="124" y="132">Z<tspan font-size="7" dy="2">e2</tspan></text>
    <text x="124" y="217">Z<tspan font-size="7" dy="2">e3</tspan><tspan dy="-2" font-style="normal"> (right leg)</tspan></text>
    <text x="182" y="217" fill="#B5473A">R<tspan font-size="7" dy="2">o</tspan></text>
  </g>

  <!-- IA and RLD integrator -->
  <rect x="250" y="85" width="80" height="80" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="290" y="120" font-size="11.5" font-weight="700" fill="#1D2A30" text-anchor="middle">front-end</text>
  <text x="290" y="135" font-size="9.5" fill="#56656B" text-anchor="middle">Chapters 7–10</text>
  <text x="296" y="186" font-size="9.5" fill="#56656B">average of the inputs, v<tspan font-size="7" dy="2">cm</tspan></text>
  <rect x="228" y="206" width="112" height="48" rx="3" fill="#E4EEF8" stroke="#1D2A30" stroke-width="1.6"/>
  <text x="284" y="226" font-size="11" font-weight="700" fill="#1D2A30" text-anchor="middle">RLD integrator</text>
  <text x="284" y="242" font-size="9.5" fill="#56656B" text-anchor="middle">−A(f) (v<tspan font-size="7" dy="2">cm</tspan><tspan dy="-2"> − V</tspan><tspan font-size="7" dy="2">mid</tspan><tspan dy="-2">)</tspan></text>
  <text x="408" y="129" font-size="11" fill="#1D2A30" font-style="italic">v<tspan font-size="8" dy="3">out</tspan></text>

  <!-- notes -->
  <g font-size="10">
    <text x="440" y="70" font-weight="700" fill="#1D2A30">what the loop does</text>
    <text x="440" y="86" fill="#56656B">common mode at the electrodes ÷ (1 + A):</text>
    <text x="440" y="100" fill="#56656B">9 mV → about 90 µV with A = 100 at 50 Hz</text>
    <text x="440" y="114" fill="#56656B">Z<tspan font-size="7" dy="2">cm</tspan><tspan dy="-2"> needed in the CMRR test: 1.15 GΩ → 11.4 MΩ</tspan></text>
    <text x="440" y="150" font-weight="700" fill="#1D2A30">what limits it</text>
    <text x="440" y="166" fill="#56656B">R<tspan font-size="7" dy="2">o</tspan><tspan dy="-2"> = 150 kΩ keeps a saturated output below</tspan></text>
    <text x="440" y="180" fill="#56656B">8 µA (patient safety)</text>
    <text x="440" y="194" fill="#56656B">the body capacitance and R<tspan font-size="7" dy="2">o</tspan><tspan dy="-2"> + Z</tspan><tspan font-size="7" dy="2">e3</tspan><tspan dy="-2"> add a</tspan></text>
    <text x="440" y="208" fill="#56656B">second pole: 53° of phase margin at a</text>
    <text x="440" y="222" fill="#56656B">5 kHz crossover with 200 pF</text>
  </g>
</svg>
