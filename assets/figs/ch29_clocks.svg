<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif">
  <title>The Open-BioAFE clock plan and the timing of one 2 ms frame</title>
  <defs>
    <marker id="ka2" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#9A6212"/>
    </marker>
  </defs>
  <text x="10" y="16" font-size="11.5" font-weight="700" fill="#1D2A30">One reference, divided down: every clock locked to every other</text>

  <!-- reference -->
  <rect x="10" y="104" width="112" height="56" rx="3" fill="#fff" stroke="#9A6212" stroke-width="1.8"/>
  <text x="66" y="124" font-size="11" font-weight="700" fill="#9A6212" text-anchor="middle">1.024 MHz</text>
  <text x="66" y="138" font-size="8.5" fill="#56656B" text-anchor="middle">external clock or</text>
  <text x="66" y="150" font-size="8.5" fill="#56656B" text-anchor="middle">trimmed RC oscillator</text>
  <g stroke="#9A6212" stroke-width="1.6" fill="none">
    <path d="M122 132 H146 M146 40 V236"/>
    <path d="M146 40 H170 M146 92 H170 M146 144 H170 M146 196 H170"/>
  </g>
  <!-- dividers -->
  <g stroke="#9A6212" stroke-width="1.4" fill="#FBF1DF">
    <rect x="170" y="28" width="40" height="24" rx="3"/>
    <rect x="170" y="80" width="40" height="24" rx="3"/>
    <rect x="170" y="132" width="40" height="24" rx="3"/>
    <rect x="170" y="184" width="40" height="24" rx="3"/>
    <rect x="300" y="28" width="48" height="24" rx="3"/>
    <rect x="300" y="184" width="48" height="24" rx="3"/>
  </g>
  <g font-size="10" fill="#1D2A30" text-anchor="middle">
    <text x="190" y="44">÷2</text><text x="190" y="96">÷256</text><text x="190" y="148">÷64</text><text x="190" y="200">÷5</text>
    <text x="324" y="44">÷1024</text><text x="324" y="200">÷4 I, Q</text>
  </g>
  <g stroke="#9A6212" stroke-width="1.6" fill="none">
    <path d="M210 40 H298" marker-end="url(#ka2)"/>
    <path d="M348 40 H420" marker-end="url(#ka2)"/>
    <path d="M210 92 H420" marker-end="url(#ka2)"/>
    <path d="M210 144 H420" marker-end="url(#ka2)"/>
    <path d="M210 196 H298" marker-end="url(#ka2)"/>
    <path d="M348 196 H420" marker-end="url(#ka2)"/>
    <path d="M254 40 V60 H420" marker-end="url(#ka2)"/>
  </g>
  <g font-size="10" font-weight="700" fill="#9A6212" text-anchor="middle">
    <text x="254" y="34">512 kHz</text><text x="384" y="34">500 S/s</text>
    <text x="254" y="86">4 kHz</text><text x="254" y="138">16 kHz</text>
    <text x="254" y="190">204.8 kHz</text><text x="384" y="190">51.2 kHz</text>
  </g>
  <!-- consumers -->
  <g font-size="9.5" fill="#1D2A30">
    <text x="426" y="37" font-weight="700">ΔΣ output word, ECG/EEG</text>
    <text x="426" y="49" fill="#56656B">CoI decimator frame: M = 1024 (Ch 20)</text>
    <text x="426" y="64" font-weight="700">ΔΣ loop, φ1 and φ2, eight channels</text>
    <text x="426" y="76" fill="#56656B">and the decimators and features (Ch 20, 23)</text>
    <text x="426" y="96" font-weight="700">choppers: input, output, servo, boosting</text>
    <text x="426" y="108" fill="#56656B">8 periods per ΔΣ word, 2 per SAR sample (Ch 9, 10)</text>
    <text x="426" y="148" font-weight="700">SAR start of conversion, 8:1 multiplexer</text>
    <text x="426" y="160" fill="#56656B">2 kS/s per channel; the 14 bits are self-timed (Ch 18)</text>
    <text x="426" y="200" font-weight="700">impedance excitation and I/Q demodulators</text>
    <text x="426" y="212" fill="#56656B">about 50 kHz, clear of the chopper's odd harmonics (Ch 28)</text>
  </g>
  <text x="170" y="236" font-size="9" fill="#56656B">SPI runs on the host's clock; everything else is derived from the reference, so the chopper ripple</text>
  <text x="170" y="248" font-size="9" fill="#56656B">and every sampling instant keep a fixed phase relation.</text>

  <!-- timing diagram: 0..2 ms over x = 120..680 (280 px per ms) -->
  <text x="10" y="278" font-size="11.5" font-weight="700" fill="#1D2A30">One 2 ms frame</text>
  <g font-size="9.5" fill="#1D2A30" text-anchor="end">
    <text x="112" y="302">ΔΣ conversion</text><text x="112" y="334">chopper, 4 kHz</text>
    <text x="112" y="364">SAR slots, 16 kS/s</text><text x="112" y="392">channel 1 samples</text>
  </g>
  <!-- ΔΣ frame -->
  <rect x="120" y="290" width="6" height="16" fill="#B5473A"/>
  <rect x="126" y="290" width="554" height="16" rx="2" fill="#E4EEF8" stroke="#1F64A8" stroke-width="1.2"/>
  <text x="403" y="302" font-size="9" fill="#1F64A8" text-anchor="middle">reset, then 1024 cycles at 512 kHz → one 16-bit word per channel</text>
  <!-- chopper -->
  <path d="M120 342 V326 H155 V342 H190 V326 H225 V342 H260 V326 H295 V342 H330 V326 H365 V342 H400 V326 H435 V342 H470 V326 H505 V342 H540 V326 H575 V342 H610 V326 H645 V342 H680" stroke="#9A6212" stroke-width="1.5" fill="none"/>
  <!-- SAR slots: 32 slots of 17.5 px -->
  <g stroke="#56656B" stroke-width="0.8">
    <path d="M120 354 V370 M137.5 354 V370 M155 354 V370 M172.5 354 V370 M190 354 V370 M207.5 354 V370 M225 354 V370 M242.5 354 V370 M260 354 V370 M277.5 354 V370 M295 354 V370 M312.5 354 V370 M330 354 V370 M347.5 354 V370 M365 354 V370 M382.5 354 V370 M400 354 V370 M417.5 354 V370 M435 354 V370 M452.5 354 V370 M470 354 V370 M487.5 354 V370 M505 354 V370 M522.5 354 V370 M540 354 V370 M557.5 354 V370 M575 354 V370 M592.5 354 V370 M610 354 V370 M627.5 354 V370 M645 354 V370 M662.5 354 V370 M680 354 V370"/>
  </g>
  <g font-size="7.5" fill="#1D2A30" text-anchor="middle">
    <text x="128.75" y="366">1</text><text x="146.25" y="366">2</text><text x="163.75" y="366">3</text><text x="181.25" y="366">4</text>
    <text x="198.75" y="366">5</text><text x="216.25" y="366">6</text><text x="233.75" y="366">7</text><text x="251.25" y="366">8</text>
    <text x="268.75" y="366">1</text><text x="286.25" y="366">2</text><text x="303.75" y="366">3</text><text x="321.25" y="366">4</text>
  </g>
  <text x="342" y="366" font-size="7.5" fill="#56656B">…</text>
  <!-- channel 1 samples every 500 us -->
  <g stroke="#1A7A4C" stroke-width="2">
    <path d="M120 400 V382 M260 400 V382 M400 400 V382 M540 400 V382"/>
  </g>
  <text x="560" y="394" font-size="8.5" fill="#1A7A4C">always at the same chopper phase,</text>
  <text x="560" y="405" font-size="8.5" fill="#1A7A4C">so the ripple aliases to DC</text>
  <!-- time axis -->
  <g stroke="#B9C6C9" stroke-width="0.8"><path d="M120 412 H680 M120 409 V415 M400 409 V415 M680 409 V415"/></g>
  <g font-size="8" fill="#56656B" text-anchor="middle"><text x="120" y="420">0</text><text x="400" y="420">1 ms</text><text x="680" y="420">2 ms</text></g>
</svg>
