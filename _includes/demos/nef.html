{% include demos/assets.html %}
<div class="bd" id="bdNef" role="group" aria-label="Interactive demo: noise, current and NEF">
  <div class="bd-head"><span>// try it · what noise costs in current</span>
    <span class="bd-seg" role="group" aria-label="Signal band"><button type="button" data-band="eeg" aria-pressed="true">EEG 0.5–100 Hz</button><button type="button" data-band="ecg" aria-pressed="false">ECG 0.05–150 Hz</button><button type="button" data-band="emg" aria-pressed="false">EMG 10–500 Hz</button></span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>total supply current I<sub>tot</sub> <b data-v="i"></b></span><input type="range" data-k="i" min="0" max="100" step="0.5" value="77.1" aria-label="Total current"></label>
    <label class="bd-sl"><span>noise efficiency factor NEF <b data-v="nef"></b></span><input type="range" data-k="nef" min="1.2" max="10" step="0.05" value="3" aria-label="NEF"></label>
  </div>
  <div class="bd-scope tall"><canvas data-c="p" aria-hidden="true"></canvas><span class="bd-tag">input-referred noise against supply current (log–log)</span></div>
  <div class="bd-read" aria-live="polite"><span>noise <b data-o="vn">–</b></span><span>power at 1.2 V <b data-o="p">–</b></span><span>PEF <b data-o="pef">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdNef'); if (!root || !window.BD) return;
  var K = 4 * 1.380649e-23 * 300 * 0.025852;          // 4kT·U_T in A·V² per Hz (300 K)
  var BANDS = { eeg: [0.5, 100], ecg: [0.05, 150], emg: [10, 500] }, band = 'eeg';
  var S = BD.bind(root, {
    i:   { map: function (v) { return 1e-8 * Math.pow(10, 3 * v / 100); }, fmt: function (x) { return BD.eng(x) + 'A'; } },
    nef: { fmt: function (x) { return x.toFixed(2); } }
  }, function () { draw(); });
  BD.seg(root, 'band', function (v) { band = v; draw(); });
  var q = function (s) { return root.querySelector(s); };
  var vn = function (nef, i, bn) { return nef * Math.sqrt(K * bn / i); };
  function draw() {
    var b = BANDS[band], bn = b[1] - b[0];
    var d = BD.setup(q('[data-c="p"]')), f = BD.frame(d, { x: [1e-8, 1e-5], y: [0.05e-6, 30e-6], xlog: true, ylog: true,
      xt: [[1e-8, '10 nA'], [1e-7, '100 nA'], [1e-6, '1 µA'], [1e-5, '10 µA']],
      yt: [[0.1e-6, '0.1 µV'], [1e-6, '1 µV'], [10e-6, '10 µV']], xl: 'I_tot', pad: { l: 50 } });
    var xs = []; for (var k = 0; k <= 60; k++) xs.push(1e-8 * Math.pow(10, 3 * k / 60));
    [[1.73, 'NEF 1.73, the MOS-pair limit', BD.C.teal], [3, 'NEF 3', 'rgba(127,184,240,.55)'], [6, 'NEF 6', 'rgba(127,184,240,.35)']].forEach(function (c) {
      BD.line(f, xs, xs.map(function (i) { return vn(c[0], i, bn); }), c[2], 1.1, [4, 3]);
      d.g.fillStyle = c[2]; d.g.fillText(c[1], f.X(1.15e-8), f.Y(vn(c[0], 1.15e-8, bn)) - 4);
    });
    BD.line(f, xs, xs.map(function (i) { return vn(S.nef, i, bn); }), BD.C.blue, 2);
    if (band === 'eeg') {
      BD.hline(f, 1.5e-6, BD.C.gold, [5, 4], 'target 1.5 µVrms');
      BD.hline(f, 1.2e-6, 'rgba(240,138,106,.7)', [2, 3], 'dry electrodes alone 1.2 µVrms');
      BD.hline(f, 0.34e-6, 'rgba(127,224,160,.6)', [2, 3], 'wet electrodes 0.34 µVrms');
    }
    var v = vn(S.nef, S.i, bn);
    BD.dot(f, S.i, v, BD.C.gold, 4.5);
    q('[data-o="vn"]').textContent = (v * 1e6).toFixed(v < 1e-6 ? 2 : 1) + ' µVrms';
    q('[data-o="p"]').textContent = BD.eng(S.i * 1.2) + 'W';
    q('[data-o="pef"]').textContent = (S.nef * S.nef * 1.2).toFixed(1);
    var vt = band === 'eeg' ? Math.sqrt(1.5 * 1.5 - 0.34 * 0.34) * 1e-6 : 1.5e-6;   // EEG: the amplifier's share next to wet electrodes
    var i15 = S.nef * S.nef * K * bn / (vt * vt);
    q('[data-o="cap"]').innerHTML = 'Over ' + b[0] + '–' + b[1] + ' Hz, NEF ' + S.nef.toFixed(2) + ' reaches ' + (vt * 1e6).toFixed(2) + ' µVrms' +
      (band === 'eeg' ? ' (the 1.5 µVrms target less the wet electrodes\' 0.34 µVrms)' : '') + ' at ' + BD.eng(i15) + 'A. ' +
      'Noise falls only as 1/√I: halving it costs four times the current. ' + (band === 'eeg' ? 'Once the amplifier is well below the electrodes\' own noise, more current buys nothing.' : '');
  }
  BD.observe(root, draw);
})();
</script>
