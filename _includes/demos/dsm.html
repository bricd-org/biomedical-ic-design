{% include demos/assets.html %}
<div class="bd" id="bdDsm" role="group" aria-label="Interactive demo: delta-sigma noise shaping, simulated live">
  <div class="bd-head"><span>// try it · a 1-bit ΔΣ modulator, simulated live</span>
    <span class="bd-seg" role="group" aria-label="Loop order"><button type="button" data-ord="1" aria-pressed="false">1st order</button><button type="button" data-ord="2" aria-pressed="true">2nd order</button></span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>oversampling ratio OSR <b data-v="osr"></b></span><input type="range" data-k="osr" min="4" max="8" step="1" value="7" aria-label="Oversampling ratio"></label>
    <label class="bd-sl"><span>input amplitude <b data-v="amp"></b></span><input type="range" data-k="amp" min="-40" max="-1" step="1" value="-6" aria-label="Input amplitude"></label>
  </div>
  <div class="bd-scope tall"><canvas data-c="p" aria-hidden="true"></canvas><span class="bd-tag">spectrum of the bit stream (dBFS), 8192 points</span><span class="bd-tag r">shaped noise against NTF</span></div>
  <div class="bd-scope short"><canvas data-c="b" aria-hidden="true"></canvas><span class="bd-tag">the input and the first 160 bits</span></div>
  <div class="bd-read" aria-live="polite"><span>in-band SQNR, simulated <b data-o="sq">–</b></span><span>linear model at full scale <b data-o="lm">–</b></span><span>band edge <b data-o="fb">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdDsm'); if (!root || !window.BD) return;
  var N = 8192, BIN = 23, ord = 2, cache = {};
  var S = BD.bind(root, {
    osr: { map: function (v) { return Math.pow(2, v); }, fmt: function (x) { return x.toFixed(0); } },
    amp: { fmt: function (x) { return x.toFixed(0) + ' dBFS'; } }
  }, function () { draw(); });
  BD.seg(root, 'ord', function (v) { ord = parseInt(v, 10); draw(); });
  var q = function (s) { return root.querySelector(s); };
  function simulate(L, amp) {                // error-feedback loop with NTF = (1 - z^-1)^L, 1-bit quantiser
    var key = L + ':' + amp; if (cache[key]) return cache[key];
    var A = Math.pow(10, amp / 20), u = new Float64Array(N), v = new Float64Array(N), e1 = 0, e2 = 0;
    for (var n = 0; n < N; n++) {
      u[n] = A * Math.sin(2 * Math.PI * BIN * n / N);
      var y = L === 1 ? u[n] - e1 : u[n] - 2 * e1 + e2;   // v = u + (1 - z^-1)^L e
      v[n] = y >= 0 ? 1 : -1;
      e2 = e1; e1 = v[n] - y;              // e = v - y, fed back with the NTF's coefficients
    }
    var re = new Float64Array(N), im = new Float64Array(N), w2 = 0;
    for (n = 0; n < N; n++) { var w = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / N); w *= w; re[n] = v[n] * w; w2 += w; }   // Hann²
    BD.fft(re, im);
    var P = new Float64Array(N / 2);
    for (var k = 0; k < N / 2; k++) P[k] = (re[k] * re[k] + im[k] * im[k]) / (w2 * w2 / 4);
    return (cache[key] = { u: u, v: v, P: P });
  }
  function draw() {
    var r = simulate(ord, S.amp), P = r.P, osr = S.osr, kb = Math.floor(N / (2 * osr));
    var sig = 0, noi = 0;
    for (var k = 1; k < kb; k++) { if (Math.abs(k - BIN) <= 3) sig += P[k]; else if (k > 2) noi += P[k]; }
    var sq = 10 * Math.log10(sig / noi);
    var lm = 6.02 + 1.76 + (20 * ord + 10) * Math.log10(osr) - 10 * Math.log10(Math.pow(Math.PI, 2 * ord) / (2 * ord + 1));
    var d = BD.setup(q('[data-c="p"]')), f = BD.frame(d, { x: [1 / N, 0.5], y: [-170, 5], xlog: true,
      xt: [[1e-3, '0.001 fs'], [1e-2, '0.01 fs'], [1e-1, '0.1 fs'], [0.5, '0.5']], yt: [[0, '0'], [-40, '−40'], [-80, '−80'], [-120, '−120'], [-160, '−160 dBFS']], pad: { l: 58 } });
    var g = d.g; g.fillStyle = 'rgba(224,184,90,.10)'; g.fillRect(f.p.l, f.p.t, f.X(kb / N) - f.p.l, d.h - f.p.t - f.p.b);
    var xs = [], ys = [];
    for (k = 1; k < N / 2; k++) { xs.push(k / N); ys.push(10 * Math.log10(P[k] + 1e-30)); }
    BD.line(f, xs, ys, BD.C.blue, 0.9);
    // NTF shape, scaled to the white quantisation noise of a 1-bit quantiser seen through the Hann² window
    var ns = [], nf = [];
    for (k = 1; k <= 200; k++) { var fr = Math.pow(10, -3.9 + 3.6 * k / 200); ns.push(fr);
      nf.push(10 * Math.log10(Math.pow(2 * Math.sin(Math.PI * fr), 2 * ord) * (1 / 3) * (2 / N) * 1.94) ); }
    BD.line(f, ns, nf, BD.C.gold, 1.2, [5, 3]);
    BD.vline(f, kb / N, BD.C.gold, [2, 3], 'fs / 2·OSR');
    // bits
    var e = BD.setup(q('[data-c="b"]')), fb = BD.frame(e, { x: [0, 160], y: [-1.3, 1.3], yt: [[-1, '−1'], [0, '0'], [1, '+1']], xt: [], pad: { l: 30, b: 8 } });
    var bx = [], by = [], ux = [];
    for (var n = 0; n < 160; n++) { bx.push(n, n + 1); by.push(r.v[n], r.v[n]); ux.push(r.u[n]); }
    BD.line(fb, bx, by, 'rgba(127,184,240,.7)', 1);
    var t5 = []; for (n = 0; n < 160; n++) t5.push(n + 0.5);
    BD.line(fb, t5, ux, BD.C.gold, 1.8);
    q('[data-o="sq"]').textContent = sq.toFixed(1) + ' dB';
    q('[data-o="lm"]').textContent = lm.toFixed(1) + ' dB';
    q('[data-o="fb"]').textContent = 'fs / ' + (2 * osr);
    q('[data-o="cap"]').innerHTML = 'The loop pushes the quantisation noise up in frequency as (2 sin πf/f<sub>s</sub>)<sup>' + (2 * ord) + '</sup>: ' + (20 * ord + 10) + ' dB per decade of oversampling for this order. ' +
      'The shaded band is what the decimation filter keeps. The linear model assumes white quantisation noise and full scale; the simulated loop, at ' + S.amp + ' dBFS, falls ' + (lm - sq).toFixed(0) + ' dB short, partly from the back-off and partly because a 1-bit quantiser is not the additive-noise source the model pretends.' +
      (ord === 1 ? ' A first-order loop also leaves idle tones: try −30 dBFS.' : '');
  }
  BD.observe(root, draw);
})();
</script>
